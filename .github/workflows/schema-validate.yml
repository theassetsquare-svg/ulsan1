name: Schema + 영구룰 Validate (KST 13:00)

on:
  schedule:
    # KST 13:00 = UTC 04:00
    - cron: '0 4 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  permanent-rule-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block dangerous words in src/index.template.html (영구 룰)
        run: |
          set -e
          DANGEROUS="밤문화 유흥 사창 성매매 도박"
          FAIL=0
          for word in $DANGEROUS; do
            COUNT=$(grep -c "$word" src/index.template.html || true)
            if [ "$COUNT" -gt 0 ]; then
              echo "::error::❌ 위험 단어 발견: '$word' x$COUNT 회 in src/index.template.html"
              grep -n "$word" src/index.template.html | head -5
              FAIL=1
            else
              echo "✅ '$word' 0건"
            fi
          done
          exit $FAIL

      - name: Block AggregateRating (가짜 별점 영구 룰)
        run: |
          if grep -q "AggregateRating\|aggregateRating" src/index.template.html; then
            echo "::error::❌ 가짜 별점(AggregateRating) 발견 — 영구 룰 위반"
            grep -n "AggregateRating\|aggregateRating" src/index.template.html
            exit 1
          fi
          echo "✅ 가짜 별점 0건"

      - name: Verify Schema 5종 present
        run: |
          set -e
          REQ='WebSite NightClub LocalBusiness Article BreadcrumbList FAQPage HowTo Organization'
          FAIL=0
          for s in $REQ; do
            if ! grep -q "\"@type\": \"$s\"" src/index.template.html; then
              echo "::error::❌ Schema 누락: $s"
              FAIL=1
            else
              echo "✅ Schema present: $s"
            fi
          done
          exit $FAIL

      - name: 정적 페이지 = 템플릿 동기화 확인 (빌드 산출물 커밋 누락 방지)
        run: |
          node scripts/build-pages.js
          if ! git diff --quiet; then
            echo "::error::❌ 생성된 정적 페이지가 템플릿과 다름 — 'node scripts/build-pages.js' 실행 후 커밋할 것"
            git diff --stat
            exit 1
          fi
          echo "✅ index.html + 8개 정적 페이지가 템플릿과 일치"

      - name: 페이지별 canonical 유일성 확인
        run: |
          python3 - <<'PY'
          import re, sys, glob
          files = ['index.html'] + sorted(glob.glob('*a/index.html'))
          seen, fail = {}, 0
          for f in files:
              h = open(f, encoding='utf-8').read()
              c = re.search(r'<link rel="canonical" href="([^"]+)"', h).group(1)
              t = re.search(r'<title>([^<]+)</title>', h).group(1)
              if c in seen:
                  print(f'❌ canonical 중복: {f} ↔ {seen[c]}'); fail = 1
              seen[c] = f
              expect = '/' if f == 'index.html' else '/' + f.split('/')[0]
              if not c.endswith(expect):
                  print(f'❌ canonical 불일치: {f} → {c}'); fail = 1
              else:
                  print(f'✅ {f:<24} {c}  |  {t[:30]}')
          if len(files) != 9:
              print(f'❌ 페이지 수 {len(files)} ≠ 9'); fail = 1
          sys.exit(fail)
          PY

      - name: Validate JSON-LD parses
        run: |
          npm install -g @schemarkup/cli || true
          # Extract each <script type="application/ld+json"> and parse
          python3 - <<'PY'
          import re, json, sys
          html = open('src/index.template.html', encoding='utf-8').read()
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          print(f"Found {len(blocks)} JSON-LD blocks")
          fail = 0
          for i, b in enumerate(blocks):
              try:
                  data = json.loads(b)
                  print(f"  [{i}] ✅ valid ({data.get('@type') or data.get('@graph','?')[:1]})")
              except Exception as e:
                  print(f"  [{i}] ❌ invalid: {e}")
                  fail = 1
          sys.exit(fail)
          PY

  live-permanent-rule-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Live 9-page dangerous word scan
        run: |
          PAGES="/ /dresscodea /budgeta /timinga /parkinga /mannersa /nearbya /comparea /legala"
          DANGEROUS="밤문화 유흥"
          FAIL=0
          for page in $PAGES; do
            URL="https://ulsanb.pages.dev$page"
            BODY=$(curl -sL "$URL")
            for word in $DANGEROUS; do
              COUNT=$(echo "$BODY" | grep -c "$word" || true)
              if [ "$COUNT" -gt 0 ]; then
                echo "::error::❌ LIVE 위험 단어: '$word' x$COUNT on $page"
                FAIL=1
              fi
            done
          done
          if [ $FAIL -eq 0 ]; then echo "✅ LIVE 영구 룰 통과"; fi
          exit $FAIL

      - name: Live AggregateRating scan
        run: |
          if curl -sL https://ulsanb.pages.dev/ | grep -q "AggregateRating"; then
            echo "::error::❌ LIVE 가짜 별점 발견"
            exit 1
          fi
          echo "✅ LIVE 가짜 별점 0건"
