name: Schema + 영구룰 Validate (KST 13:00)

on:
  schedule:
    # KST 13:00 = UTC 04:00
    - cron: '0 4 * * *'
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  permanent-rule-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block dangerous words in index.html (영구 룰)
        run: |
          set -e
          DANGEROUS="밤문화 유흥 사창 성매매 도박"
          FAIL=0
          for word in $DANGEROUS; do
            COUNT=$(grep -c "$word" index.html || true)
            if [ "$COUNT" -gt 0 ]; then
              echo "::error::❌ 위험 단어 발견: '$word' x$COUNT 회 in index.html"
              grep -n "$word" index.html | head -5
              FAIL=1
            else
              echo "✅ '$word' 0건"
            fi
          done
          exit $FAIL

      - name: Block AggregateRating (가짜 별점 영구 룰)
        run: |
          if grep -q "AggregateRating\|aggregateRating" index.html; then
            echo "::error::❌ 가짜 별점(AggregateRating) 발견 — 영구 룰 위반"
            grep -n "AggregateRating\|aggregateRating" index.html
            exit 1
          fi
          echo "✅ 가짜 별점 0건"

      - name: Verify Schema 5종 present
        run: |
          set -e
          REQ='WebSite NightClub LocalBusiness Article BreadcrumbList FAQPage HowTo Organization'
          FAIL=0
          for s in $REQ; do
            if ! grep -q "\"@type\": \"$s\"" index.html; then
              echo "::error::❌ Schema 누락: $s"
              FAIL=1
            else
              echo "✅ Schema present: $s"
            fi
          done
          exit $FAIL

      - name: Validate JSON-LD parses
        run: |
          npm install -g @schemarkup/cli || true
          # Extract each <script type="application/ld+json"> and parse
          python3 - <<'PY'
          import re, json, sys
          html = open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
          print(f"Found {len(blocks)} JSON-LD blocks")
          fail = 0
          for i, b in enumerate(blocks):
              try:
                  data = json.loads(b)
                  print(f"  [{i}] ✅ valid ({data.get('@type') or data.get('@graph','?')[:1]})")
              except Exception as e:
                  print(f"  [{i}] ❌ invalid: {e}")
                  fail = 1
          sys.exit(fail)
          PY

  live-permanent-rule-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Live 9-page dangerous word scan
        run: |
          PAGES="/ /dresscode /budget /timing /parking /manners /nearby /compare /legal"
          DANGEROUS="밤문화 유흥"
          FAIL=0
          for page in $PAGES; do
            URL="https://ulsanb.pages.dev$page"
            BODY=$(curl -sL "$URL")
            for word in $DANGEROUS; do
              COUNT=$(echo "$BODY" | grep -c "$word" || true)
              if [ "$COUNT" -gt 0 ]; then
                echo "::error::❌ LIVE 위험 단어: '$word' x$COUNT on $page"
                FAIL=1
              fi
            done
          done
          if [ $FAIL -eq 0 ]; then echo "✅ LIVE 영구 룰 통과"; fi
          exit $FAIL

      - name: Live AggregateRating scan
        run: |
          if curl -sL https://ulsanb.pages.dev/ | grep -q "AggregateRating"; then
            echo "::error::❌ LIVE 가짜 별점 발견"
            exit 1
          fi
          echo "✅ LIVE 가짜 별점 0건"
