name: SEO Daily Cron (KST 12:00)

on:
  schedule:
    # KST 12:00 = UTC 03:00
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-sitemap-and-ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update sitemap lastmod to today (KST)
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          echo "Today (KST): $TODAY"
          sed -i "s|<lastmod>[0-9-]\+</lastmod>|<lastmod>$TODAY</lastmod>|g" sitemap.xml
          sed -i "s|<lastmod>[0-9-]\+</lastmod>|<lastmod>$TODAY</lastmod>|g" public/sitemap.xml || true

      - name: Commit if changed
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@wish-5yw.pages.dev"
          if ! git diff --quiet; then
            git add sitemap.xml public/sitemap.xml || true
            git commit -m "chore(seo): daily sitemap lastmod refresh"
            git push
          else
            echo "no changes"
          fi

      - name: Ping Google Sitemap
        run: |
          curl -sI "https://www.google.com/ping?sitemap=https://wish-5yw.pages.dev/sitemap.xml" | head -1 || true

      - name: Ping Bing IndexNow
        run: |
          curl -sI "https://www.bing.com/ping?sitemap=https://wish-5yw.pages.dev/sitemap.xml" | head -1 || true

      - name: Submit URLs via IndexNow (best-effort)
        run: |
          KEY="${{ secrets.INDEXNOW_KEY }}"
          if [ -z "$KEY" ]; then
            echo "INDEXNOW_KEY secret not set — skipping (optional)"
            exit 0
          fi
          curl -sX POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"wish-5yw.pages.dev\",\"key\":\"$KEY\",\"urlList\":[\"https://wish-5yw.pages.dev/\",\"https://wish-5yw.pages.dev/dresscodea\",\"https://wish-5yw.pages.dev/budgeta\",\"https://wish-5yw.pages.dev/timinga\",\"https://wish-5yw.pages.dev/parkinga\",\"https://wish-5yw.pages.dev/mannersa\",\"https://wish-5yw.pages.dev/nearbya\",\"https://wish-5yw.pages.dev/comparea\",\"https://wish-5yw.pages.dev/legala\"]}" || true
